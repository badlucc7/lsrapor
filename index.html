<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Lara Smile Lead Raporu</title>
<style>
  /* Tek tema: aydınlık (sunum ekranı için). Tek vurgu rengi: mavi. Tek köşe ölçüsü: 10px. */
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --ink: #172033;
    --muted: #55637a;
    --line: #d9e2ee;
    --accent: #1b5fb0;
    --accent-ink: #ffffff;
    --accent-soft: #e6f0fb;
    --zebra: #f8fafd;
    --total: #e6f0fb;
    --warn: #9a4a0c;
    --err: #b3261e;
    --shadow: 0 1px 2px rgba(23, 50, 90, .06), 0 4px 14px rgba(23, 50, 90, .06);
    --r: 10px;
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI Variable Text", "Segoe UI", "SF Pro Text", system-ui, -apple-system, Roboto, sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 20px 56px; }

  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0; letter-spacing: -.01em; color: var(--ink); }
  h1 span { color: var(--accent); }
  .sync { color: var(--muted); font-size: 14px; }
  .sync.stale { color: var(--warn); font-weight: 600; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  select, input[type=date], input[type=password] {
    font: inherit; font-weight: 500; color: var(--ink); background: #fff;
    border: 1px solid #b9c7d9; border-radius: var(--r); padding: 8px 12px; min-height: 42px;
  }
  button {
    font: inherit; font-weight: 600; border-radius: var(--r); padding: 8px 16px; min-height: 42px;
    border: 1px solid #b9c7d9; background: #fff; color: var(--ink); cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
  }
  button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover:not(:disabled) { background: #164f93; border-color: #164f93; }
  :focus-visible { outline: 3px solid #7fb0e8; outline-offset: 2px; }

  .seg { display: inline-flex; border: 1px solid #b9c7d9; border-radius: var(--r); overflow: hidden; background: #fff; }
  .seg button { border: 0; border-radius: 0; min-height: 40px; padding: 8px 14px; font-weight: 600; background: #fff; }
  .seg button + button { border-left: 1px solid #b9c7d9; }
  .seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }
  .seg button[aria-pressed=true]:hover { background: var(--accent); }

  .check { display: flex; align-items: center; gap: 8px; min-height: 42px; font-size: 14px; font-weight: 600; color: var(--ink); }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }

  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .presets button { min-height: 36px; padding: 4px 14px; font-size: 14px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin: 18px 0; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); }
  .kpi .l { font-size: 14px; font-weight: 600; color: var(--muted); }
  .kpi .v { font-size: 34px; line-height: 1.15; font-weight: 700; color: var(--accent); margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .kpi .s { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 14px; }
  .tabs button { min-height: 40px; padding: 6px 16px; background: #fff; }
  .tabs button[aria-selected=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  h2 { font-size: 17px; margin: 24px 0 8px; color: var(--ink); }
  .note { font-size: 13px; color: var(--muted); margin: -2px 0 8px; }
  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; font-size: 15px; }
  th, td { padding: 10px 14px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { background: var(--accent-soft); color: #123f78; font-weight: 700; font-size: 13px; text-align: center; white-space: normal; border-bottom: 2px solid #b8d0ec; }
  td:first-child, th:first-child { text-align: left; position: sticky; left: 0; background: inherit; }
  th:first-child { background: var(--accent-soft); z-index: 1; }
  tbody tr:nth-child(even) td { background: var(--zebra); }
  tbody tr td:first-child { background: var(--card); font-weight: 500; }
  tbody tr:nth-child(even) td:first-child { background: var(--zebra); }
  tbody tr:hover td { background: #eef5fd; }
  tr.total td { background: var(--total) !important; font-weight: 700; border-top: 2px solid #b8d0ec; border-bottom: 0; }

  .msg { padding: 12px 14px; border-radius: var(--r); margin: 14px 0; border: 1px solid var(--line); background: var(--card); font-weight: 500; }
  .msg.err { color: var(--err); border-color: #e3aaa6; background: #fdf3f2; }

  #login { max-width: 380px; margin: 14vh auto 0; text-align: center; padding: 28px 24px; }
  #login h1 { font-size: 24px; margin-bottom: 6px; }
  #login p { color: var(--muted); margin: 0 0 16px; }
  #login input { width: 100%; text-align: center; letter-spacing: 8px; font-size: 20px; margin-bottom: 12px; }
  #login button { width: 100%; }
  [hidden] { display: none !important; }

  @media (max-width: 640px) {
    .wrap { padding: 16px 12px 40px; }
    h1 { font-size: 22px; }
    .kpi .v { font-size: 28px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <section id="login" class="panel" hidden>
    <h1>Lara Smile <span>Lead Raporu</span></h1>
    <p>Devam etmek için PIN girin</p>
    <form id="loginForm">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" aria-label="PIN" required>
      <button class="primary" type="submit">Giriş</button>
    </form>
    <div id="loginErr" class="msg err" hidden></div>
  </section>

  <main id="app" hidden>
    <header>
      <h1>Lara Smile <span>Lead Raporu</span></h1>
      <div class="sync" id="syncInfo">Veri durumu yükleniyor...</div>
    </header>

    <section class="panel">
      <div class="controls">
        <label class="field">Klinik
          <select id="clinic">
            <option value="LS">Lara Smile + Premium</option>
            <option value="MTT">MTT</option>
          </select>
        </label>
        <label class="field">Başlangıç <input type="date" id="from"></label>
        <label class="field">Bitiş <input type="date" id="to"></label>
        <div class="field" id="eskiWrap">Eski datalar
          <div class="seg" role="group" aria-label="Eski datalar">
            <button type="button" data-eski="0" aria-pressed="false">Dahil değil</button>
            <button type="button" data-eski="1" aria-pressed="true">Dönem içi booklar</button>
            <button type="button" data-eski="all" aria-pressed="false">Tümü (tarih dışı dahil)</button>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="fresh" checked> Önce Kommo'dan güncelle</label>
        <button class="primary" id="go">Raporu Getir</button>
        <button id="xls" disabled>Excel İndir</button>
        <button id="refresh" title="Kommo'dan son değişiklikleri şimdi çek">Veriyi Şimdi Güncelle</button>
        <button id="logout">Çıkış</button>
      </div>
      <div class="presets" aria-label="Hızlı aralıklar">
        <button data-p="thisweek">Bu hafta</button>
        <button data-p="lastweek">Geçen hafta</button>
        <button data-p="thismonth">Bu ay</button>
        <button data-p="lastmonth">Geçen ay</button>
      </div>
    </section>

    <div id="status" class="msg" hidden></div>
    <div id="cards" class="cards"></div>
    <div id="tabs" class="tabs" role="tablist"></div>
    <div id="view"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="excel.js"></script>
<script>
  // Apps Script web app adresi (Dağıt > Web uygulaması > /exec ile biten URL)
  const API_URL = 'https://script.google.com/macros/s/AKfycbzolrv0DFoENqKSny_Ymgtzdj7s-sEWHPV-r-3d94t5loAzMCogLwl9H8wjRMIBic_rtA/exec';

  const $ = (id) => document.getElementById(id);
  let PIN = '', REPORT = null, activeTab = 0, ESKI = true;

  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function setRange(a, b) { $('from').value = ymd(a); $('to').value = ymd(b); }
  function preset(p) {
    const t = new Date(); t.setHours(12, 0, 0, 0);
    const dow = (t.getDay() + 6) % 7;
    const monday = new Date(t); monday.setDate(t.getDate() - dow);
    if (p === 'thisweek') { const e = new Date(monday); e.setDate(e.getDate() + 6); setRange(monday, e); }
    if (p === 'lastweek') { const s = new Date(monday); s.setDate(s.getDate() - 7); const e = new Date(s); e.setDate(e.getDate() + 6); setRange(s, e); }
    if (p === 'thismonth') setRange(new Date(t.getFullYear(), t.getMonth(), 1), new Date(t.getFullYear(), t.getMonth() + 1, 0));
    if (p === 'lastmonth') setRange(new Date(t.getFullYear(), t.getMonth() - 1, 1), new Date(t.getFullYear(), t.getMonth(), 0));
  }

  async function api(action, extra) {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ pin: PIN, action }, extra || {})) });
    return res.json();
  }

  function fmt(c) {
    const v = c.v;
    if (v === null || v === undefined) return '';
    switch (c.fmt) {
      case 'pct': return (v * 100).toFixed(1).replace('.', ',') + '%';
      case 'gbp': return '£' + Math.round(v).toLocaleString('tr-TR');
      case 'd1': return v.toFixed(1).replace('.', ',');
      case 'int': return Math.round(v).toLocaleString('tr-TR');
      default: return String(v);
    }
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function showMsg(text, isErr) {
    const m = $('status'); m.textContent = text; m.className = 'msg' + (isErr ? ' err' : ''); m.hidden = !text;
  }
  function renderSync(iso) {
    const el = $('syncInfo');
    if (!iso) { el.textContent = 'Henüz senkron yok'; el.className = 'sync stale'; return; }
    const d = new Date(iso), mins = Math.round((Date.now() - d.getTime()) / 60000);
    el.textContent = 'Son veri güncellemesi: ' + d.toLocaleString('tr-TR') + (mins > 150 ? ' (eski olabilir)' : '');
    el.className = 'sync' + (mins > 150 ? ' stale' : '');
  }

  function renderCards(m) {
    const pct = (a, b) => (b ? (a / b * 100).toFixed(1).replace('.', ',') + '%' : '0%');
    const items = [
      ['Yeni Lead', m.yeni.toLocaleString('tr-TR'), !m.eskiDahil ? 'Eski datalar dahil değil' : m.eski + (m.eskiMod === 'all' ? ' eski lead (booklama tarihi dönem dışı dahil)' : ' eski lead dönemde booklandı')],
      ['Booked', m.booked, m.yeniBooked + ' yeni + ' + m.eskiBooked + ' eski'],
      ['Booked Oranı (Yeni)', pct(m.yeniBooked, m.yeni), 'yeni booked / yeni lead'],
      ['Ciro', '£' + Math.round(m.ciro).toLocaleString('tr-TR'), m.eskiDahil ? 'yeni + eski booklar' : 'sadece yeni leadler'],
      ['Lost (Yeni)', m.lost, pct(m.lost, m.yeni) + ' of yeni lead']
    ];
    $('cards').innerHTML = items.map((i) => '<div class="kpi"><div class="l">' + esc(i[0]) + '</div><div class="v">' + esc(i[1]) + '</div><div class="s">' + esc(i[2]) + '</div></div>').join('');
  }
  function tableHtml(t) {
    let h = '<h2>' + esc(t.title) + '</h2>';
    if (t.note) h += '<div class="note">' + esc(t.note) + '</div>';
    h += '<div class="scroll"><table><thead><tr>' + t.headers.map((x) => '<th>' + esc(x) + '</th>').join('') + '</tr></thead><tbody>';
    t.body.forEach((r) => { h += '<tr>' + r.map((c) => '<td>' + esc(fmt(c)) + '</td>').join('') + '</tr>'; });
    if (t.total) h += '<tr class="total">' + t.total.map((c) => '<td>' + esc(fmt(c)) + '</td>').join('') + '</tr>';
    return h + '</tbody></table></div>';
  }
  function renderTabs() {
    $('tabs').innerHTML = REPORT.sheets.map((s, i) =>
      '<button role="tab" aria-selected="' + (i === activeTab) + '" data-i="' + i + '">' + esc(s.name) + '</button>').join('');
    $('view').innerHTML = REPORT.sheets[activeTab].tables.map(tableHtml).join('');
  }

  // Güncelleme sonucunu açıkça anlat: atlandı / yarım kaldı / kaç kayıt değişti
  function refreshNote(rf) {
    if (rf.skipped && rf.result && rf.result.skipped) return { t: 'Başka bir güncelleme şu an çalışıyor, birkaç dakika sonra tekrar deneyin.', err: true };
    if (rf.skipped) return { t: 'Veri 10 dakikadan yeni olduğu için Kommo\'dan tekrar çekilmedi (son güncelleme saati bu yüzden değişmedi).', err: false };
    const x = rf.result || {};
    if (x.skipped) return { t: 'Başka bir güncelleme şu an çalışıyor, birkaç dakika sonra tekrar deneyin.', err: true };
    if (x.complete === false) return { t: 'Güncelleme YARIM kaldı (süre doldu). Tekrar "Veriyi Şimdi Güncelle"ye basın.', err: true };
    return { t: 'Kommo güncellendi: ' + (x.changed || 0) + ' lead değişti.', err: false };
  }

  async function loadReport(skipRefresh) {
    const from = $('from').value, to = $('to').value;
    if (!from || !to || from > to) { showMsg('Geçerli bir tarih aralığı seçin.', true); return; }
    $('go').disabled = true; $('xls').disabled = true;
    let note = null;
    try {
      if (!skipRefresh && $('fresh').checked) {
        showMsg('Kommo\'dan güncel veri çekiliyor (1-2 dk sürebilir)...');
        const rf = await api('refresh');
        if (!rf.ok) { showMsg('Kommo güncelleme HATASI: ' + (rf.error || 'bilinmeyen hata'), true); if (/PIN/.test(rf.error || '')) logout(); $('go').disabled = false; return; }
        note = refreshNote(rf);
      }
      showMsg('Rapor hazırlanıyor...');
      const r = await api('report', { from, to, clinic: $('clinic').value, eski: ESKI });
      if (!r.ok) { showMsg(r.error || 'Hata', true); if (/PIN/.test(r.error || '')) logout(); $('go').disabled = false; return; }
      REPORT = r; activeTab = Math.min(activeTab, r.sheets.length - 1); showMsg(note ? note.t : '', note && note.err);
      renderSync(r.lastSync); renderCards(r.meta); renderTabs();
      $('xls').disabled = false;
    } catch (e) { showMsg('Bağlantı hatası: ' + e.message, true); }
    $('go').disabled = false;
  }

  async function downloadXlsx() {
    if (!REPORT) return;
    const wb = KommoExcel.buildWorkbook(ExcelJS, REPORT);
    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    const m = REPORT.meta;
    a.download = (m.clinic === 'MTT' ? 'mtt' : 'lara_smile') + '_rapor_' + m.from + '_' + m.to + (m.eskiMod === 'off' ? '_eskisiz' : m.eskiMod === 'all' ? '_eski_tumu' : '') + '.xlsx';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }

  async function refreshData() {
    $('refresh').disabled = true; showMsg('Kommo\'dan son değişiklikler çekiliyor (1-2 dk sürebilir)...');
    try {
      const r = await api('refresh');
      if (!r.ok) { showMsg('Kommo güncelleme HATASI: ' + (r.error || 'bilinmeyen hata'), true); }
      else { const n = refreshNote(r); showMsg(n.t, n.err); renderSync(r.lastSync); }
    } catch (e) { showMsg('Bağlantı hatası: ' + e.message, true); }
    $('refresh').disabled = false;
  }

  function logout() { sessionStorage.removeItem('pin'); PIN = ''; REPORT = null; $('app').hidden = true; $('login').hidden = false; $('pin').value = ''; }

  async function enter(pin) {
    PIN = pin;
    const r = await api('status');
    if (!r.ok) { PIN = ''; throw new Error(r.error || 'Giriş başarısız'); }
    sessionStorage.setItem('pin', pin);
    $('login').hidden = true; $('app').hidden = false;
    renderSync(r.lastSync);
    preset('lastweek');
    loadReport();
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('loginErr').hidden = true;
    try { await enter($('pin').value.trim()); }
    catch (err) { $('loginErr').textContent = err.message; $('loginErr').hidden = false; }
  });
  $('go').addEventListener('click', () => loadReport(false));
  $('xls').addEventListener('click', downloadXlsx);
  $('refresh').addEventListener('click', refreshData);
  $('logout').addEventListener('click', logout);
  document.querySelector('.presets').addEventListener('click', (e) => { const p = e.target.dataset.p; if (p) { preset(p); loadReport(false); } });
  $('tabs').addEventListener('click', (e) => { const i = e.target.dataset.i; if (i !== undefined) { activeTab = +i; renderTabs(); } });
  // Eski datalar anahtarı: Kommo'dan tekrar çekmez, sadece raporu yeniden hesaplatır
  $('eskiWrap').addEventListener('click', (e) => {
    const v = e.target.dataset.eski; if (v === undefined) return;
    ESKI = v === '0' ? false : (v === 'all' ? 'all' : true);
    $('eskiWrap').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.eski === v)));
    if (REPORT) loadReport(true);
  });

  (async function init() {
    if (API_URL.indexOf('BURAYA') === 0) { $('login').hidden = false; $('loginErr').textContent = 'API_URL ayarlanmamış (index.html içinde).'; $('loginErr').hidden = false; return; }
    const saved = sessionStorage.getItem('pin');
    if (saved) { try { await enter(saved); return; } catch (e) { sessionStorage.removeItem('pin'); } }
    $('login').hidden = false;
  })();
</script>
</body>
</html>
